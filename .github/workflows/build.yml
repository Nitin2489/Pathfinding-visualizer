name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            werror: ON
          - os: macos-latest
            werror: ON
          # MSVC builds at /W4; warnings are reported but not fatal.
          - os: windows-latest
            werror: OFF
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPATHFINDING_WERROR=${{ matrix.werror }}

    - name: Build
      run: cmake --build build --config Release --parallel

    # Unit tests, CLI validation and an end-to-end benchmark smoke run
    # (exits non-zero if any correctness check fails).
    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Reproducibility check
      run: |
        exe=build/pathfinding
        [ -f build/Release/pathfinding.exe ] && exe=build/Release/pathfinding.exe
        "$exe" --benchmark --suite all --grids 2 --runs 4 --warmup 0 --quiet --csv a.csv
        "$exe" --benchmark --suite all --grids 2 --runs 4 --warmup 0 --quiet --csv b.csv
        # Everything except the two timing columns (29: search_time_ms,
        # 30: end_to_end_time_ms) must be identical, on every platform.
        diff <(cut -d, -f1-28,31- a.csv) <(cut -d, -f1-28,31- b.csv)

  sanitizers:
    name: ubuntu-asan-ubsan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPATHFINDING_SANITIZE=ON -DPATHFINDING_WERROR=ON
    - name: Build
      run: cmake --build build --parallel
    - name: Test
      run: ctest --test-dir build --output-on-failure
